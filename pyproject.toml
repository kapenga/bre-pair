[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brepair"
version = "0.1.0"
description = "Native byte-exact BRe-Pair tokenization and bounded compression workflows"
readme = "python/README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Wybren Kapenga", email = "wybren@kapenga.com"}]

[project.urls]
Repository = "https://github.com/kapenga/bre-pair"

[tool.setuptools.packages.find]
where = ["python"]
include = ["brepair*"]

[tool.setuptools.package-data]
brepair = ["_native/*", "_native/licenses/*"]
